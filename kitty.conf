# vim:fileencoding=utf-8:foldmethod=marker

#: Fonts {{{

font_family     Hack 
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.0

force_ltr no

symbol_map

disable_ligatures always

font_features none

modify_font cell_height 105%

text_composition_strategy platform

#: }}}

# Cursor customization {{{

cursor #c1440e
cursor_text_color #ffffff
cursor_shape block
cursor_blink_interval 0.8
cursor_stop_blinking_after 0

#: }}}

#: Scrollback {{{

scrollback_lines 10000
#ste_actions quote-urls-at-prompt,confirm: Scrollback {{luse{

scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

scrollback_pager_history_size 0

scrollback_fill_enlarged_window yes 

wheel_scroll_multiplier 5.0

wheel_scroll_min_lines 1

touch_scroll_multiplier 1.5

#: }}}

:# Mouse {{{

mouse_hide_wait 2.0

url_color #0087bd
url_style curly
open_url_modifiers ctrl
open_url_with default
detect_urls yes
underline_hyperlinks hover

copy_on_select no
strip_trailing_spaces smart
rectangle_select_modifiers alt
terminal_select_modifiers shift
select_by_word_characters :@-./_~?&=%+#

click_interval -1.0
focus_follows_mouse yes
pointer_shape_when_grabbed arrow
paste_actions quote-urls-at-prompt,confirm

#: }}}

#: Performance tuning {{{

repaint_delay 10
input_delay 3
sync_to_monitor yes

#: }}}

#: Terminal bell {{{

enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab "🔔 "
command_on_bell none
bell_path none

#: }}}

#: Window layout {{{

remember_window_size no
initial_window_width 960
initial_window_height 540

enabled_layouts grid,splits

window_resize_step_cells 2
window_resize_step_lines 2

window_border_width 0.5pt
draw_minimal_borders yes

window_margin_width 0
single_window_margin_width -1

window_padding_width 8
single_window_padding_width -1

placement_strategy top-left

active_border_color #c1440e
inactive_border_color #444444
bell_border_color #c1440e
inactive_text_alpha 0.8

hide_window_decorations no

resize_in_steps no

visual_window_select_characters 1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ

confirm_os_window_close 2

#: }}}

#: Tab bar {{{

tab_bar_style hidden
tab_bar_min_tabs 2

#: }}}

#: Color scheme {{{

foreground #ffffff
background #111111

background_opacity 1.0
background_blur 0
dynamic_background_opacity no

background_image none

dim_opacity 0.5

selection_foreground #ffffff
selection_background #444444

# ANSI colors
# 0-7: normal colors
color0  #111111
color1  #cc0000
color2  #2e8b57
color3  #c1440e
color4  #3465a4
color5  #ff4fd8
color6  #06989a
color7  #d3d7cf

# 8-15: bright colors
color8  #555753
color9  #ef2929
color10 #4e9a06
color11 #f57900
color12 #729fcf
color13 #ff79d8
color14 #34e2e2
color15 #ffffff

# Marks
mark1_foreground #111111
mark1_background #c1440e

mark2_foreground #111111
mark2_background #ff4fd8

mark3_foreground #111111
mark3_background #2e8b57

#: }}}

#: Advanced {{{

shell .
editor .

close_on_child_death no

allow_remote_control no
listen_on none

startup_session none

clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

clipboard_max_size 512

allow_hyperlinks yes

shell_integration enabled

allow_cloning ask

clone_source_strategies venv,conda,env_var,path

notify_on_cmd_finish never

term xterm-kitty

terminfo_type path

forward_stdio no

#: }}}

#: OS specific tweaks {{{

linux_display_server auto

#: }}}

#: Keyboard shortcuts {{{

kitty_mod ctrl+shift
clear_all_shortcuts no
map_timeout 0.0

map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+s paste_from_selection
map shift+insert paste_from_selection

map ctrl+shift+t no_op
map ctrl+shift+q no_op
map ctrl+shift+right no_op
map ctrl+shift+left no_op
map ctrl+tab no_op
map ctrl+shift+tab no_op
map ctrl+shift+period no_op
map ctrl+shift+comma no_op
map ctrl+shift+alt+t no_op

map ctrl+alt+t new_os_window_with_cwd

map ctrl+alt+h launch --cwd=current --location=vsplit
map ctrl+alt+l launch --cwd=current --location=vsplit
map ctrl+alt+j launch --cwd=current --location=hsplit
map ctrl+alt+k launch --cwd=current --location=hsplit

map ctrl+w close_window
map ctrl+alt+space focus_visible_window

map ctrl+alt+left  move_window left
map ctrl+alt+down  move_window bottom
map ctrl+alt+up    move_window top
map ctrl+alt+right move_window right

map ctrl+shift+left  resize_window narrower
map ctrl+shift+right resize_window wider
map ctrl+shift+up    resize_window taller
map ctrl+shift+down  resize_window shorter

map ctrl+alt+r reset_window_sizes

map ctrl+alt+s goto_layout splits
map ctrl+alt+g goto_layout grid

map ctrl+shift+slash search_scrollback
map ctrl+shift+h show_scrollback
map ctrl+shift+g show_last_command_output
map ctrl+shift+y copy_last_command_output

map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1

map ctrl+shift+l next_layout

map ctrl+shift+f3 command_palette
map ctrl+shift+f2 edit_config_file
map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config

map ctrl+shift+up   remote_control scroll-window 5l-
map ctrl+shift+down remote_control scroll-window 5l+

map ctrl+q close_os_window
#: }}}
